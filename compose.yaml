services:
  backend:
    build:
      context: .
      dockerfile: Crochetserver/Dockerfile
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?Set your Supabase project URL in .env}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?Set your Supabase server secret key in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SUPABASE_CA_CERT: ${SUPABASE_CA_CERT:-}
      SHOP_FACEBOOK_URL: ${SHOP_FACEBOOK_URL:-}
      SHOP_MESSENGER_URL: ${SHOP_MESSENGER_URL:-}
      SHOP_EMAIL: ${SHOP_EMAIL:-}
    expose:
      - "8080"
  client:
    build: ./Crochetclient
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
